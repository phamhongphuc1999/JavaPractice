services:
    mysql_container:
        image: mysql:latest
        container_name: "simple_sql_container"
        environment:
            MYSQL_ROOT_PASSWORD: java
        ports:
            - "3326:3306"
        volumes:
            - "./sql/setup.sql:/docker-entrypoint-initdb.d/1.sql"
            - "./sql/mysql-data:/var/lib/mysql"
